<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Multi-Color Festive Gradient for Ring & Accents -->
    <linearGradient id="logoFestive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Brand Cymbal Gradient -->
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Planner Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Left: Emblem Icon (scaled from 200x200 down to 104x104) -->
  <g transform="translate(8, 8) scale(0.52)">
    <!-- Outer White Halo -->
    <circle cx="100" cy="100" r="96" fill="#FFFFFF" />
    <!-- Gradient Ring -->
    <circle cx="100" cy="100" r="91" fill="none" stroke="url(#logoFestive)" stroke-width="7" stroke-linecap="round" />
    <circle cx="100" cy="100" r="85" fill="#F8FAFC" />

    <!-- Festive Confetti Stars -->
    <polygon points="100,16 103,23 110,23 105,28 107,35 100,31 93,35 95,28 90,23 97,23" fill="#FBBF24" />
    <circle cx="45" cy="48" r="3" fill="#EC4899" />
    <circle cx="155" cy="46" r="3" fill="#3B82F6" />
    <polygon points="155,135 157,139 161,139 158,142 159,146 155,144 151,146 152,142 149,139 153,139" fill="#F43F5E" />
    <polygon points="40,138 42,141 46,141 43,143 44,147 40,145 36,147 37,143 34,141 38,141" fill="#3B82F6" />

    <!-- Calendar Card (Left) -->
    <g transform="translate(32, 68) scale(0.68)">
      <rect x="0" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <path d="M0 8 Q0 0 8 0 L48 0 Q56 0 56 8 L56 16 L0 16 Z" fill="#EF4444" />
      <!-- Cake on Calendar -->
      <g transform="translate(14, 25)">
        <rect x="4" y="16" width="20" height="12" rx="3" fill="#FDE047" stroke="#F59E0B" stroke-width="1.5" />
        <path d="M4 19 Q9 23 14 19 Q19 23 24 19" fill="none" stroke="#EC4899" stroke-width="2" />
        <rect x="8" y="10" width="2" height="6" fill="#60A5FA" />
        <rect x="18" y="10" width="2" height="6" fill="#60A5FA" />
        <circle cx="9" cy="8" r="2" fill="#F97316" />
        <circle cx="19" cy="8" r="2" fill="#F97316" />
      </g>
    </g>

    <!-- Shopping Bag (Right) -->
    <g transform="translate(122, 70) scale(0.68)">
      <rect x="8" y="12" width="40" height="48" rx="6" fill="#3B82F6" />
      <path d="M18 12 Q18 0 28 0 Q38 0 38 12" fill="none" stroke="#93C5FD" stroke-width="3" />
      <circle cx="28" cy="36" r="9" fill="#FFFFFF" />
      <path d="M32 31 A6 6 0 1 0 32 41" fill="none" stroke="#2563EB" stroke-width="3" />
    </g>

    <!-- AI Robot with Party Hat (Center) -->
    <g transform="translate(68, 56)">
      <!-- Antenna -->
      <line x1="32" y1="18" x2="32" y2="6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
      <circle cx="32" cy="4" r="5" fill="#38BDF8" />
      <!-- Party Hat -->
      <g transform="translate(32, 10)">
        <polygon points="0,-28 -14,14 14,14" fill="#F43F5E" />
        <circle cx="0" cy="-28" r="4.5" fill="#FBBF24" />
      </g>
      <!-- Robot Face -->
      <rect x="4" y="20" width="56" height="44" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5" />
      <rect x="11" y="27" width="42" height="30" rx="8" fill="#0F172A" />
      <!-- Eyes & Smile -->
      <path d="M18 39 Q23 33 28 39" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <path d="M36 39 Q41 33 46 39" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <path d="M26 48 Q32 53 38 48" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Shopping Cart Pill Motif -->
    <g transform="translate(62, 134)">
      <rect x="4" y="0" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <g transform="translate(14, 6)">
        <path d="M2 3 L6 3 L10 13 L22 13 L25 5 L8 5" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="11" cy="16" r="1.5" fill="#2563EB" />
        <circle cx="21" cy="16" r="1.5" fill="#2563EB" />
      </g>
      <!-- Voice Wave Motif -->
      <g transform="translate(44, 8)">
        <line x1="0" y1="6" x2="0" y2="10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
        <line x1="5" y1="2" x2="5" y2="14" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="4" x2="10" y2="12" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
        <line x1="15" y1="6" x2="15" y2="10" stroke="#F97316" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Right: Typography System -->
  <g transform="translate(126, 20)">
    <!-- Row 1: Brand & Sub-Brand Badge -->
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.04em">
        Cymbal<tspan fill="#2563EB">Mart</tspan>
      </text>

      <!-- Badge: PLANNER – Birthday -->
      <g transform="translate(202, -26)">
        <rect x="0" y="0" width="186" height="32" rx="16" fill="url(#badgeGrad)" />
        <text x="93" y="21" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.04em">
          PLANNER – Birthday
        </text>
      </g>
    </g>

    <!-- Row 2: Tagline -->
    <text x="2" y="66" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="-0.01em">
      Smart Event &amp; Shopping Assistant
    </text>

    <!-- Row 3: Alexa-Inspired AI Assistant Pill -->
    <g transform="translate(2, 77)">
      <!-- Subtle sound wave mini bar -->
      <g transform="translate(0, 7)">
        <line x1="0" y1="3" x2="0" y2="9" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
        <line x1="4" y1="1" x2="4" y2="11" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" />
        <line x1="8" y1="2" x2="8" y2="10" stroke="#EC4899" stroke-width="1.8" stroke-linecap="round" />
        <line x1="12" y1="4" x2="12" y2="8" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="20" y="15" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" letter-spacing="0.02em">
        Alexa-Inspired Conversational Planning
      </text>
      <text x="264" y="15" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">
        • By Badal Kumar Sahu
      </text>
    </g>
  </g>
</svg>
