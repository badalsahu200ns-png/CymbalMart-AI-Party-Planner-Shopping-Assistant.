<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Multi-Color Festive Gradient Ring -->
    <linearGradient id="festiveRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="30%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Robot Face Soft Gradient -->
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Party Hat Gradient -->
    <linearGradient id="partyHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Shopping Bag Gradient -->
    <linearGradient id="shopBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gift Box Gradient -->
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Calendar Gradient -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Protective Halo / Background -->
  <circle cx="100" cy="100" r="94" fill="#FFFFFF" />
  
  <!-- Outer Festive Ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="url(#festiveRing)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Subtle Inner Aura -->
  <circle cx="100" cy="100" r="85" fill="#F8FAFC" />

  <!-- Confetti Elements -->
  <circle cx="45" cy="48" r="3" fill="#EC4899" />
  <circle cx="152" cy="45" r="3" fill="#3B82F6" />
  <rect x="36" y="80" width="5" height="5" rx="1.5" fill="#F97316" transform="rotate(25 38 82)" />
  <rect x="160" y="82" width="5" height="5" rx="1.5" fill="#8B5CF6" transform="rotate(-20 162 84)" />
  <polygon points="100,16 103,23 110,23 105,28 107,35 100,31 93,35 95,28 90,23 97,23" fill="#FBBF24" />
  <polygon points="155,135 157,139 161,139 158,142 159,146 155,144 151,146 152,142 149,139 153,139" fill="#F43F5E" />
  <polygon points="40,138 42,141 46,141 43,143 44,147 40,145 36,147 37,143 34,141 38,141" fill="#3B82F6" />

  <!-- Background Left: Birthday Calendar Card -->
  <g transform="translate(32, 68) scale(0.68)">
    <rect x="0" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))" />
    <path d="M0 8 Q0 0 8 0 L48 0 Q56 0 56 8 L56 16 L0 16 Z" fill="url(#calHeader)" />
    <circle cx="14" cy="8" r="2.5" fill="#FFFFFF" />
    <circle cx="42" cy="8" r="2.5" fill="#FFFFFF" />
    
    <!-- Mini Birthday Cake on Calendar -->
    <g transform="translate(14, 25)">
      <!-- Cake Base -->
      <rect x="4" y="16" width="20" height="12" rx="3" fill="#FDE047" stroke="#F59E0B" stroke-width="1.5" />
      <path d="M4 19 Q9 23 14 19 Q19 23 24 19" fill="none" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
      <!-- Candles -->
      <rect x="8" y="10" width="2" height="6" fill="#60A5FA" />
      <rect x="18" y="10" width="2" height="6" fill="#60A5FA" />
      <!-- Flames -->
      <circle cx="9" cy="8" r="2" fill="#F97316" />
      <circle cx="19" cy="8" r="2" fill="#F97316" />
    </g>
  </g>

  <!-- Background Right: CymbalMart Shopping Bag & Gift -->
  <g transform="translate(122, 70) scale(0.68)">
    <!-- Shopping Bag -->
    <rect x="8" y="12" width="40" height="48" rx="6" fill="url(#shopBag)" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.1))" />
    <path d="M18 12 Q18 0 28 0 Q38 0 38 12" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
    <!-- CymbalMart 'C' logo badge on bag -->
    <circle cx="28" cy="36" r="9" fill="#FFFFFF" />
    <path d="M32 31 A6 6 0 1 0 32 41" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    
    <!-- Little Gift Box in front of bag -->
    <g transform="translate(-10, 26)">
      <rect x="0" y="8" width="26" height="24" rx="4" fill="url(#giftBox)" stroke="#6D28D9" stroke-width="1" />
      <rect x="11" y="8" width="4" height="24" fill="#FBBF24" />
      <rect x="0" y="18" width="26" height="4" fill="#FBBF24" />
      <!-- Bow -->
      <path d="M8 8 C8 2 13 4 13 8 C13 4 18 2 18 8" fill="none" stroke="#FBBF24" stroke-width="2.5" />
    </g>
  </g>

  <!-- Centerpiece: Friendly AI Robot with Birthday Party Hat -->
  <g id="aiRobot" transform="translate(68, 56)" filter="url(#softGlow)">
    <!-- Robot Antenna with Alexa Glow Orb -->
    <line x1="32" y1="18" x2="32" y2="6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <circle cx="32" cy="4" r="5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />

    <!-- Festive Striped Party Hat Over Head -->
    <g transform="translate(32, 10)">
      <polygon points="0,-28 -14,14 14,14" fill="url(#partyHat)" stroke="#E11D48" stroke-width="1" />
      <!-- Stripes on Hat -->
      <path d="M-5 -2 L5 2" stroke="#FEE2E2" stroke-width="2.5" stroke-linecap="round" />
      <path d="M-9 7 L9 11" stroke="#FEE2E2" stroke-width="2.5" stroke-linecap="round" />
      <!-- Pom-pom on top -->
      <circle cx="0" cy="-28" r="4.5" fill="#FBBF24" stroke="#D97706" stroke-width="1" />
    </g>

    <!-- Robot Head Shell -->
    <rect x="4" y="20" width="56" height="44" rx="14" fill="url(#robotBody)" stroke="#94A3B8" stroke-width="2.5" />

    <!-- Robot Ears / Headphone Accents (Alexa Sound Nodes) -->
    <rect x="-1" y="32" width="6" height="18" rx="3" fill="#3B82F6" />
    <rect x="59" y="32" width="6" height="18" rx="3" fill="#3B82F6" />

    <!-- Screen Face (Glossy Navy) -->
    <rect x="11" y="27" width="42" height="30" rx="8" fill="#0F172A" />

    <!-- Glowing Blue Eyes (Friendly Arcs) -->
    <path d="M18 39 Q23 33 28 39" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <path d="M36 39 Q41 33 46 39" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- Friendly Smile -->
    <path d="M26 48 Q32 53 38 48" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="16" cy="47" r="2.5" fill="#FDA4AF" opacity="0.8" />
    <circle cx="48" cy="47" r="2.5" fill="#FDA4AF" opacity="0.8" />
  </g>

  <!-- Foreground Bottom: Modern Floating Shopping Cart Basket Accent -->
  <g transform="translate(62, 134)">
    <rect x="4" y="0" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.07))" />
    <!-- Cart Icon & Mini Sparkles -->
    <g transform="translate(14, 6)">
      <path d="M2 3 L6 3 L10 13 L22 13 L25 5 L8 5" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="11" cy="16" r="1.5" fill="#2563EB" />
      <circle cx="21" cy="16" r="1.5" fill="#2563EB" />
    </g>
    <!-- Alexa Voice Soundwave Bar Motif inside badge -->
    <g transform="translate(44, 8)">
      <line x1="0" y1="6" x2="0" y2="10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="2" x2="5" y2="14" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="4" x2="10" y2="12" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="6" x2="15" y2="10" stroke="#F97316" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
